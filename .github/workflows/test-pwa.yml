name: PWA checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check sw.js
          node --check assets/js/pwa.js
          node --check assets/js/timetable.js
          node --check assets/js/departure.js
          node --check assets/js/watch.js
          node --test scripts/test-pwa.mjs
