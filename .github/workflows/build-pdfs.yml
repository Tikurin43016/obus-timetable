name: Build NITOC timetable PDFs
on:
  push:
    branches:
      - feat/nitocbus-rebrand
    paths:
      - obus_2026_kosen.json
      - scripts/generate-pdfs.py
      - .github/workflows/build-pdfs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out timetable branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Japanese fonts and PDF generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install "weasyprint>=68,<70" "qrcode[pil]>=8,<10" "pymupdf>=1.26,<2"
      - name: Generate and validate both PDFs
        run: |
          python scripts/generate-pdfs.py
          python - <<'PY'
          import fitz
          for p in ("obus_2026_kosen_s2k.pdf", "obus_2026_kosen_k2s.pdf"):
              pdf = fitz.open(p)
              assert len(pdf) == 1, f"{p} has {len(pdf)} pages (expected A4 single sheet)"
              text = pdf[0].get_text()
              for phrase in ("NITOCバスナビ", "2026年10月1日改正", "nitocbus.pages.dev"):
                  assert phrase in text, f"{p} missing {phrase}"
              print(p, "OK")
          PY
      - name: Commit generated PDFs to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obus_2026_kosen_s2k.pdf obus_2026_kosen_k2s.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update NITOCバスナビ printable PDF timetables"
            git push
          fi
