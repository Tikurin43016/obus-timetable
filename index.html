<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a67">
  <meta name="description" content="小山高専向けのおーバス時刻表。小山駅東口と高専の往復時刻表をHTMLまたはPDFで確認できます。">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/site.css">
  <title>おーバス 高専時刻表</title>
</head>
<body>
  <main class="landing">
    <header class="site-header">
      <a class="brand" href="./" aria-label="おーバス 高専時刻表 トップ">おーバス 高専時刻表</a>
      <span class="revision-badge"><time datetime="2026-10-01">2026年10月1日改正</time></span>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">小山高専向け</p>
      <h1 id="page-title">高専 ⇄ 小山駅を、<br>すぐ確認。</h1>
      <p class="lead">方向を選ぶだけで時刻表を開けます。PDFは各カード下部から。</p>
    </section>

    <nav class="direction-grid" aria-label="時刻表の方向">
      <article class="direction-card">
        <a class="direction-main" href="./obus_2026_kosen_s2k.html">
          <span class="direction-kicker">駅から高専</span>
          <span class="route-visual" aria-hidden="true">
            <span class="place">小山駅東口</span>
            <span class="route-line"><span></span><b>→</b></span>
            <span class="place">高専</span>
          </span>
          <span class="direction-action">時刻表を見る <b aria-hidden="true">→</b></span>
        </a>
        <a class="pdf-link" href="./obus_2026_kosen_s2k.pdf">
          <span>PDF版</span><small>印刷・保存用</small><b aria-hidden="true">↗</b>
        </a>
      </article>

      <article class="direction-card">
        <a class="direction-main" href="./obus_2026_kosen_k2s.html">
          <span class="direction-kicker">高専から駅</span>
          <span class="route-visual" aria-hidden="true">
            <span class="place">高専</span>
            <span class="route-line"><span></span><b>→</b></span>
            <span class="place">小山駅東口</span>
          </span>
          <span class="direction-action">時刻表を見る <b aria-hidden="true">→</b></span>
        </a>
        <a class="pdf-link" href="./obus_2026_kosen_k2s.pdf">
          <span>PDF版</span><small>印刷・保存用</small><b aria-hidden="true">↗</b>
        </a>
      </article>
    </nav>

    <aside class="site-note">
      <strong>高専側は便によって停留所が異なります。</strong>
      <span>各時刻の「正門」「入口」「中二」表示をご確認ください。</span>
    </aside>

    <footer class="site-footer">
      <p>小山市の公式時刻表をもとに作成した、小山高専向けの非公式時刻表です。</p>
    </footer>
  </main>
</body>
</html>
